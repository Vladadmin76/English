<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>English from Zero</title>
<meta name="theme-color" content="#33383c">
<style>
  :root{
    --bg:#33383c; --card:#3d4348; --ink:#e9ebec; --ink-soft:#a2a9ae;
    --accent:#2a9578; --accent-ink:#ffffff; --accent-soft:#1f3a33;
    --line:#4a5257; --danger:#e2776a; --warn:#e0ac52; --good:#4cbf8a;
    --shadow:0 2px 10px rgba(0,0,0,.3);
    --radius:14px; --nav-h:60px; --fs:1;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px);
  }
  #app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;}
  header.topbar{
    position:sticky;top:0;z-index:5;background:var(--bg);
    padding:14px 16px 8px;display:flex;align-items:center;justify-content:space-between;
  }
  header.topbar h1{font-size:calc(17px * var(--fs));margin:0;font-weight:700;}
  header.topbar .back{
    background:none;border:none;font-size:calc(15px * var(--fs));color:var(--accent);padding:6px 8px;
    margin-left:-8px;font-weight:600;cursor:pointer;
  }
  main{padding:8px 16px 24px;}
  .card{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px;margin-bottom:14px;
  }
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .col{display:flex;flex-direction:column;gap:10px;}
  h2{font-size:calc(16px * var(--fs));margin:0 0 8px;}
  h3{font-size:calc(15px * var(--fs));margin:0 0 6px;}
  p{margin:0 0 8px;line-height:1.5;}
  .muted{color:var(--ink-soft);font-size:calc(13px * var(--fs));}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:var(--accent);color:var(--accent-ink);border:none;border-radius:12px;
    padding:13px 16px;font-size:calc(15px * var(--fs));font-weight:600;cursor:pointer;width:100%;
    -webkit-user-select:none;user-select:none;
  }
  .btn:active{opacity:.85;}
  .btn.secondary{background:var(--accent-soft);color:var(--accent);}
  .btn.outline{background:transparent;color:var(--accent);border:1.5px solid var(--accent);}
  .btn.ghost{background:transparent;color:var(--ink-soft);box-shadow:none;}
  .btn.danger{background:#fbeae7;color:var(--danger);}
  .btn.block{margin-bottom:10px;}
  .btn[disabled]{opacity:.4;pointer-events:none;}
  .btn-row{display:flex;gap:8px;}
  .btn-row .btn{flex:1;}
  .pill{
    display:inline-block;padding:3px 10px;border-radius:999px;font-size:calc(12px * var(--fs));font-weight:600;
    background:var(--accent-soft);color:var(--accent);
  }
  .pill.new{background:#282c4d;color:#a5adf0;}
  .pill.learning{background:#4a3a1f;color:var(--warn);}
  .pill.known{background:#1f3a4a;color:#82c2ec;}
  .pill.mastered{background:#1f3d30;color:var(--good);}
  .progress-bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;}
  .progress-bar > div{height:100%;background:var(--accent);border-radius:999px;transition:width .3s;}
  .list-item{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;
  }
  .list-item:last-child{border-bottom:none;}
  .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .dot.new{background:#a5adf0;} .dot.learning{background:#e8b355;}
  .dot.known{background:#7bbde8;} .dot.mastered{background:var(--good);}
  nav#bottom-nav{
    position:fixed;left:0;right:0;bottom:0;z-index:10;
    background:var(--card);border-top:1px solid var(--line);
    display:flex;justify-content:space-around;align-items:center;
    height:var(--nav-h);padding-bottom:env(safe-area-inset-bottom);
    max-width:520px;margin:0 auto;
  }
  nav#bottom-nav button{
    background:none;border:none;font-size:calc(11px * var(--fs));color:var(--ink-soft);
    display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;padding:6px 2px;cursor:pointer;
  }
  nav#bottom-nav button.active{color:var(--accent);font-weight:700;}
  nav#bottom-nav .ic{font-size:calc(19px * var(--fs));line-height:1;}
  .word-en{font-size:calc(26px * var(--fs));font-weight:700;}
  .word-ru{font-size:calc(18px * var(--fs));color:var(--ink-soft);}
  .example{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:calc(14px * var(--fs));}
  .example .en{font-style:italic;}
  .speak-btn{
    background:var(--accent-soft);color:var(--accent);border:none;border-radius:50%;
    width:44px;height:44px;font-size:18px;cursor:pointer;flex:none;
  }
  .opt{
    display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);
    border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:calc(15px * var(--fs));cursor:pointer;color:var(--ink);
  }
  .opt.correct{border-color:var(--good);background:#1f3d30;font-weight:700;font-size:calc(16px * var(--fs));}
  .opt.wrong{border-color:var(--danger);background:#4a2420;font-weight:700;font-size:calc(16px * var(--fs));}
  .opt[disabled]{pointer-events:none;}
  input[type=text]{
    width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);font-size:calc(16px * var(--fs));
    background:var(--card);color:var(--ink);
  }
  input[type=range]{width:100%;}
  .tokens{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;margin-bottom:14px;padding:8px;border:1.5px dashed var(--line);border-radius:10px;}
  .token{
    background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 12px;
    font-size:calc(15px * var(--fs));cursor:pointer;border:none;
  }
  .token[disabled]{opacity:.3;}
  .bank{display:flex;flex-wrap:wrap;gap:8px;}
  .imm-word{color:var(--accent);font-weight:700;border-bottom:1.5px dotted var(--accent);cursor:pointer;}
  .banner{
    background:#4a3a1f;color:#e3b155;border-radius:10px;padding:10px 12px;font-size:calc(13px * var(--fs));margin-bottom:12px;
  }
  .center{text-align:center;}
  .toast{
    position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px);transform:translateX(-50%);
    background:#1a2420;color:#fff;padding:10px 16px;border-radius:10px;font-size:calc(14px * var(--fs));z-index:50;
    box-shadow:var(--shadow);
  }
  .switch-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);}
  .switch-row:last-child{border-bottom:none;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat{background:var(--accent-soft);border-radius:10px;padding:10px;text-align:center;}
  .stat b{display:block;font-size:calc(20px * var(--fs));color:var(--accent);}
  .stat span{font-size:calc(12px * var(--fs));color:var(--ink-soft);}
  .empty{text-align:center;padding:30px 10px;color:var(--ink-soft);}
  .empty .ic{font-size:calc(38px * var(--fs));display:block;margin-bottom:8px;}
  a.download-link{display:none;}
  .result-banner{
    font-size:calc(19px * var(--fs));font-weight:700;text-align:center;border-radius:10px;
    padding:14px 12px;margin-top:12px;line-height:1.4;
  }
  .result-banner.correct{background:#1f3d30;color:var(--good);}
  .result-banner.wrong{background:#4a2420;color:var(--danger);}
  .result-banner .sub{display:block;font-size:calc(14px * var(--fs));font-weight:400;color:var(--ink-soft);margin-top:4px;}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="back" id="backBtn" style="visibility:hidden">‹ Назад</button>
    <h1 id="topTitle">English from Zero</h1>
    <span style="width:60px"></span>
  </header>
  <main id="screen-root"></main>
  <nav id="bottom-nav">
    <button data-route="#/menu"><span class="ic">🏠</span><span>Меню</span></button>
    <button data-route="#/review"><span class="ic">🔁</span><span>Повторение</span></button>
    <button data-route="#/exercises"><span class="ic">✏️</span><span>Упражнения</span></button>
    <button data-route="#/grammar"><span class="ic">📘</span><span>Грамматика</span></button>
    <button data-route="#/settings"><span class="ic">⚙️</span><span>Настройки</span></button>
  </nav>
</div>
<script>
(function(){
"use strict";

/* ============================== UTILS ============================== */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function todayISO(){ return new Date().toISOString(); }
function addDays(date, days){ const d=new Date(date); d.setDate(d.getDate()+days); return d; }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pickRandom(arr,n){ return shuffle(arr).slice(0,n); }
function byId(arr){ const m={}; (arr||[]).forEach(x=>m[x.id]=x); return m; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function normalize(s){ return String(s||"").toLowerCase().trim().replace(/[.,!?;:"']/g,"").replace(/\s+/g," "); }
function hashRatio(str){
  let h=0; str=String(str);
  for(let i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))>>>0; }
  return (h%1000)/1000;
}
function levenshtein(a,b){
  a=normalize(a); b=normalize(b);
  const m=a.length,n=b.length;
  if(!m) return n; if(!n) return m;
  const d=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) d[i][0]=i;
  for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    const cost = a[i-1]===b[j-1] ? 0 : 1;
    d[i][j]=Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+cost);
  }
  return d[m][n];
}
function similar(a,b){
  a=normalize(a); b=normalize(b);
  if(!a.length && !b.length) return true;
  const dist = levenshtein(a,b);
  const longer = Math.max(a.length,b.length)||1;
  return (1 - dist/longer) >= 0.72;
}

/* ============================== AI TUTOR (DeepSeek via proxy) ============================== */
// The DeepSeek key itself never lives here - it stays on the Render server.
// The shared secret (TUTOR_PROXY_SECRET on the server) is entered by the
// user once in Settings and kept only in this device's localStorage - it
// never goes into this file or the git history. It's a light deterrent
// against casual abuse of the proxy endpoint, not real security (anyone
// who enters their own value here could still call the endpoint) - real
// protection is the spending cap set on the DeepSeek account itself.
const TUTOR_API_URL = "https://call.fixtorllc.com/api/tutor-chat";

/* ============================== ALPHABET ============================== */
const ALPHABET = [
  {letter:"A", name:"Ay", word:"apple", ru:"яблоко"}, {letter:"B", name:"Bee", word:"book", ru:"книга"},
  {letter:"C", name:"See", word:"cat", ru:"кошка"}, {letter:"D", name:"Dee", word:"dog", ru:"собака"},
  {letter:"E", name:"Ee", word:"egg", ru:"яйцо"}, {letter:"F", name:"Eff", word:"fish", ru:"рыба"},
  {letter:"G", name:"Jee", word:"girl", ru:"девочка"}, {letter:"H", name:"Aitch", word:"house", ru:"дом"},
  {letter:"I", name:"Eye", word:"ice", ru:"лёд"}, {letter:"J", name:"Jay", word:"juice", ru:"сок"},
  {letter:"K", name:"Kay", word:"key", ru:"ключ"}, {letter:"L", name:"El", word:"lion", ru:"лев"},
  {letter:"M", name:"Em", word:"milk", ru:"молоко"}, {letter:"N", name:"En", word:"name", ru:"имя"},
  {letter:"O", name:"Oh", word:"orange", ru:"апельсин"}, {letter:"P", name:"Pee", word:"pizza", ru:"пицца"},
  {letter:"Q", name:"Kyoo", word:"queen", ru:"королева"}, {letter:"R", name:"Ar", word:"rain", ru:"дождь"},
  {letter:"S", name:"Ess", word:"sun", ru:"солнце"}, {letter:"T", name:"Tee", word:"tea", ru:"чай"},
  {letter:"U", name:"You", word:"umbrella", ru:"зонт"}, {letter:"V", name:"Vee", word:"van", ru:"фургон"},
  {letter:"W", name:"Double-you", word:"water", ru:"вода"}, {letter:"X", name:"Ex", word:"X-ray", ru:"рентген"},
  {letter:"Y", name:"Why", word:"yellow", ru:"жёлтый"}, {letter:"Z", name:"Zee", word:"zebra", ru:"зебра"}
];

/* ============================== STORAGE ============================== */
const STORAGE_KEY = "eng0_progress_v1";
function defaultProgress(){
  return {
    currentLevel: null,
    completedLevels: [],
    words: {},
    grammarProgress: {},
    immersionLevel: 0.3,
    settings: { speechEnabled:true, recognitionEnabled:true, showAlphabet:true, fontSize:1, tutorSecret:"" },
    examHistory: [],
    stats: { createdAt: todayISO() }
  };
}
let STATE = null;
function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultProgress();
    const parsed = JSON.parse(raw);
    const merged = Object.assign(defaultProgress(), parsed);
    merged.settings = Object.assign(defaultProgress().settings, parsed.settings||{});
    return merged;
  }catch(e){ console.warn("progress load failed", e); return defaultProgress(); }
}
let saveTimer=null;
function saveProgress(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(e){ console.warn("save failed", e); }
  }, 60);
}

/* ============================== DATA ============================== */
let MANIFEST = null;
let LEVEL_DATA = null; // current level json
let WORDS_BY_ID = {}, GRAMMAR_BY_ID = {}, EXERCISES_BY_ID = {}, DIALOGUES_BY_ID = {}, TOPICS_BY_ID = {};

async function fetchJSON(url){
  const res = await fetch(url, {cache:"no-cache"});
  if(!res.ok) throw new Error("Не удалось загрузить "+url);
  return res.json();
}

async function loadManifest(){
  MANIFEST = await fetchJSON("data/manifest.json");
}

async function loadLevel(levelId){
  const entry = MANIFEST.levels.find(l=>l.id===levelId);
  if(!entry) throw new Error("Уровень не найден: "+levelId);
  LEVEL_DATA = await fetchJSON(entry.file);
  WORDS_BY_ID = byId(LEVEL_DATA.words);
  GRAMMAR_BY_ID = byId(LEVEL_DATA.grammar);
  EXERCISES_BY_ID = byId(LEVEL_DATA.exercises);
  DIALOGUES_BY_ID = byId(LEVEL_DATA.dialogues);
  TOPICS_BY_ID = byId(LEVEL_DATA.topics);
}

async function ensureLevelLoaded(){
  if(!STATE.currentLevel){
    STATE.currentLevel = MANIFEST.levels[0].id;
    saveProgress();
  }
  if(!LEVEL_DATA || LEVEL_DATA.level !== STATE.currentLevel){
    await loadLevel(STATE.currentLevel);
  }
}

/* ============================== WORD PROGRESS ============================== */
const CHANNELS = ["recall","production","pronunciation","listening"];

function newWordEntry(){
  return {
    status:"new",
    sm2:{ repetitions:0, interval:0, easeFactor:2.5, nextReviewAt: todayISO() },
    channels:{
      recall:{log:[]}, production:{log:[]}, pronunciation:{log:[]}, listening:{log:[]}
    }
  };
}
function wp(wordId){
  if(!STATE.words[wordId]) STATE.words[wordId] = newWordEntry();
  return STATE.words[wordId];
}
function channelRatio(entry, ch){
  const log = entry.channels[ch].log;
  const window = log.slice(-10);
  if(window.length < 3) return {count:window.length, ratio:null};
  const ok = window.filter(Boolean).length;
  return {count:window.length, ratio: ok/window.length};
}
function pushChannel(wordId, ch, success){
  const entry = wp(wordId);
  entry.channels[ch].log.push(!!success);
  if(entry.channels[ch].log.length>20) entry.channels[ch].log = entry.channels[ch].log.slice(-20);
  recomputeStatus(wordId);
  saveProgress();
}
function recomputeStatus(wordId){
  const entry = wp(wordId);
  let masteredChannels = 0;
  CHANNELS.forEach(ch=>{
    const r = channelRatio(entry, ch);
    if(r.ratio!==null && r.ratio>=0.8) masteredChannels++;
  });
  if(masteredChannels>=2){
    entry.status = "mastered";
  } else if(entry.sm2.repetitions>=2){
    entry.status = "known";
  } else if(entry.status!=="new"){
    entry.status = "learning";
  }
}
function introduceWord(wordId){
  const entry = wp(wordId);
  if(entry.status==="new"){
    entry.status="learning";
    entry.sm2.nextReviewAt = todayISO();
    saveProgress();
  }
  return entry;
}

/* SM-2 */
function sm2Grade(entry, q){ // q: 0-5
  let {repetitions, interval, easeFactor} = entry.sm2;
  if(q<3){
    repetitions = 0;
    interval = 1;
  } else {
    repetitions += 1;
    if(repetitions===1) interval=1;
    else if(repetitions===2) interval=6;
    else interval = Math.round(interval*easeFactor);
  }
  easeFactor = easeFactor + (0.1 - (5-q)*(0.08+(5-q)*0.02));
  easeFactor = Math.max(1.3, easeFactor);
  entry.sm2 = { repetitions, interval, easeFactor, nextReviewAt: addDays(new Date(), interval).toISOString() };
}
function gradeWord(wordId, label){ // label: again|hard|easy
  const entry = wp(wordId);
  const q = label==="again"?1 : label==="hard"?3 : 5;
  sm2Grade(entry, q);
  pushChannel(wordId, "recall", q>=3);
}
function dueWords(){
  const now = new Date();
  return Object.keys(STATE.words).filter(id=>{
    const e = STATE.words[id];
    if(e.status==="new") return false;
    return new Date(e.sm2.nextReviewAt) <= now;
  });
}
function newWordsQueue(topicId, limit){
  const topics = topicId ? [TOPICS_BY_ID[topicId]] : LEVEL_DATA.topics;
  const ids = [];
  topics.forEach(t=>{ if(t) t.words.forEach(id=>{ if(!STATE.words[id] || STATE.words[id].status==="new") ids.push(id); }); });
  const seen = new Set(); const uniq = ids.filter(id=>{ if(seen.has(id)) return false; seen.add(id); return true; });
  return limit ? uniq.slice(0, limit) : uniq;
}

/* ============================== MASTERY / LEVEL STATS ============================== */
function levelWordIds(){ return LEVEL_DATA.words.map(w=>w.id); }
function masteredRatio(){
  const ids = levelWordIds();
  if(!ids.length) return 0;
  const mastered = ids.filter(id=>STATE.words[id] && STATE.words[id].status==="mastered").length;
  return mastered/ids.length;
}
function levelProgressRatio(){
  const ids = levelWordIds();
  if(!ids.length) return 0;
  const weights = {new:0, learning:0.35, known:0.65, mastered:1};
  const sum = ids.reduce((acc,id)=>acc + weights[STATE.words[id]? STATE.words[id].status : "new"], 0);
  return sum/ids.length;
}
function examReady(){
  return masteredRatio() >= (LEVEL_DATA.passingThreshold||0.9);
}

/* ============================== IMMERSION ============================== */
let IMM_DICT_CACHE = null, IMM_CACHE_KEY = "";
function immersionDict(){
  const key = STATE.currentLevel+"|"+Object.keys(STATE.words).filter(id=>STATE.words[id].status==="mastered").sort().join(",");
  if(IMM_DICT_CACHE && IMM_CACHE_KEY===key) return IMM_DICT_CACHE;
  const dict = [];
  Object.keys(STATE.words).forEach(id=>{
    if(STATE.words[id].status==="mastered" && WORDS_BY_ID[id]){
      const w = WORDS_BY_ID[id];
      if(w.ru && w.en) dict.push({ru:w.ru, en:w.en});
    }
  });
  dict.sort((a,b)=>b.ru.length-a.ru.length);
  IMM_DICT_CACHE = dict; IMM_CACHE_KEY = key;
  return dict;
}
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function t(str){
  if(!str) return "";
  if(!LEVEL_DATA) return esc(str);
  const dict = immersionDict();
  const lvl = STATE.immersionLevel;
  if(!dict.length || lvl<=0) return esc(str);
  let out = esc(str);
  dict.forEach(pair=>{
    if(hashRatio(pair.ru+"|"+Math.round(lvl*20)) >= lvl) return;
    const re = new RegExp("(^|[^а-яёА-ЯЁ])("+escRe(pair.ru)+")(?=[^а-яёА-ЯЁ]|$)", "gi");
    out = out.replace(re, (m,pre,word)=>{
      return pre + '<span class="imm-word" data-ru="'+esc(pair.ru)+'" data-en="'+esc(pair.en)+'" data-action="imm-toggle">'+esc(pair.en)+'</span>';
    });
  });
  return out;
}

/* ============================== SPEECH ============================== */
const Speech = {
  synthSupported: "speechSynthesis" in window,
  recogSupported: !!(window.SpeechRecognition || window.webkitSpeechRecognition),
  speak(text){
    if(!this.synthSupported || !STATE.settings.speechEnabled || !text) return;
    try{
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US"; u.rate = 0.92;
      window.speechSynthesis.speak(u);
    }catch(e){ console.warn(e); }
  },
  recognize(){
    return new Promise((resolve, reject)=>{
      if(!this.recogSupported || !STATE.settings.recognitionEnabled) return reject(new Error("unsupported"));
      const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
      const rec = new Ctor();
      rec.lang = "en-US"; rec.maxAlternatives = 3; rec.interimResults = false;
      let done=false;
      rec.onresult = (ev)=>{
        done=true;
        const alts = Array.from(ev.results[0]).map(r=>r.transcript);
        resolve(alts);
      };
      rec.onerror = (ev)=>{ if(!done){ done=true; reject(new Error(ev.error||"recognition error")); } };
      rec.onend = ()=>{ if(!done){ done=true; reject(new Error("no-speech")); } };
      try{ rec.start(); }catch(e){ reject(e); }
    });
  }
};

/* ============================== EXERCISE GENERATION ============================== */
function wordsInTopics(topicId){
  if(!topicId) return LEVEL_DATA.words;
  const t = TOPICS_BY_ID[topicId];
  return t ? t.words.map(id=>WORDS_BY_ID[id]).filter(Boolean) : LEVEL_DATA.words;
}
function distractorsFor(word, n, field){
  const pool = LEVEL_DATA.words.filter(w=>w.id!==word.id && w.partOfSpeech===word.partOfSpeech);
  const src = pool.length>=n ? pool : LEVEL_DATA.words.filter(w=>w.id!==word.id);
  return pickRandom(src, n).map(w=>w[field]);
}
function genChooseTranslation(word){
  const distractors = distractorsFor(word, 3, "en");
  const options = shuffle([word.en, ...distractors]);
  return { kind:"choose_translation", word, prompt: word.ru, options, correct: word.en };
}
function genFillBlank(word){
  const sentence = word.exampleEn || word.en;
  const re = new RegExp("\\b"+escRe(word.en.split(" ")[0])+"\\w*", "i");
  const blanked = sentence.match(re) ? sentence.replace(re, "____") : sentence + " (____)";
  return { kind:"fill_blank", word, sentenceRu: word.exampleRu||word.ru, sentence: blanked, correct: (sentence.match(re)||[word.en])[0] };
}
function genBuildSentence(word){
  const sentence = (word.exampleEn||word.en).replace(/[.?!]$/,"");
  const tokens = sentence.split(" ");
  return { kind:"build_sentence", word, translationRu: word.exampleRu||word.ru, tokens: shuffle(tokens), correctOrder: tokens };
}
function genListenChoose(word){
  const distractors = distractorsFor(word, 3, "exampleRu").filter(Boolean);
  while(distractors.length<3) distractors.push(distractorsFor(word,1,"ru")[0]||"...");
  const options = shuffle([word.exampleRu||word.ru, ...distractors.slice(0,3)]);
  return { kind:"listen_repeat", word, audio: word.exampleEn||word.en, options, correct: word.exampleRu||word.ru };
}
function genPronounce(word){
  const phrase = word.exampleEn || word.en;
  return { kind:"pronounce", word, target: phrase };
}
function generateExerciseFor(word, type){
  if(type==="fill_blank") return genFillBlank(word);
  if(type==="build_sentence") return genBuildSentence(word);
  if(type==="listen_repeat") return genListenChoose(word);
  if(type==="pronounce") return genPronounce(word);
  return genChooseTranslation(word);
}
function exerciseQueue(topicId, count){
  const words = wordsInTopics(topicId).filter(w=>STATE.words[w.id] && STATE.words[w.id].status!=="new");
  const chosen = pickRandom(words, Math.min(count, words.length));
  const types = ["choose_translation","fill_blank","build_sentence","listen_repeat"];
  if(Speech.recogSupported && STATE.settings.recognitionEnabled) types.push("pronounce");
  return chosen.map((w,i)=>generateExerciseFor(w, types[i%types.length]));
}

/* ============================== ROUTER ============================== */
const routes = {};
function route(pattern, fn){ routes[pattern]=fn; }
const navHistory = [];
function go(hash){ location.hash = hash; }
function goBack(){ if(navHistory.length>1){ navHistory.pop(); location.hash = navHistory[navHistory.length-1]; } else go("#/menu"); }

async function router(){
  await ensureReady();
  await ensureLevelLoaded();
  const hash = location.hash || "#/menu";
  if(navHistory[navHistory.length-1]!==hash) navHistory.push(hash);
  const [path, query] = hash.slice(2).split("?");
  const parts = path.split("/").filter(Boolean);
  const params = {};
  if(query) query.split("&").forEach(p=>{ const [k,v]=p.split("="); params[k]=decodeURIComponent(v||""); });
  const root = document.getElementById("screen-root");
  const backBtn = document.getElementById("backBtn");
  backBtn.style.visibility = parts[0]==="menu" || !parts[0] ? "hidden" : "visible";
  document.querySelectorAll("#bottom-nav button").forEach(b=>{
    b.classList.toggle("active", ("#"+b.dataset.route.slice(1)).split("/")[1]===parts[0]);
  });
  let html = "<div class='empty'>Загрузка…</div>";
  try{
    const key = parts[0]||"menu";
    const fn = routes[key] || routes["menu"];
    html = await fn(parts.slice(1), params);
  }catch(e){
    console.error(e);
    html = "<div class='card'><p>Ошибка: "+esc(e.message)+"</p></div>";
  }
  root.innerHTML = html;
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", router);

function applyFontScale(){
  document.documentElement.style.setProperty("--fs", STATE.settings.fontSize || 1);
}

let readyPromise=null;
function ensureReady(){
  if(!readyPromise){
    readyPromise = (async ()=>{
      STATE = loadProgress();
      applyFontScale();
      await loadManifest();
      await ensureLevelLoaded();
    })();
  }
  return readyPromise;
}

    </div>`;
  }
  return renderExamQuestion();
});
function buildExamPool(){
  const curated = (LEVEL_DATA.examPool||[]).map(id=>EXERCISES_BY_ID[id]).filter(Boolean)
    .map(ex=>({kind:ex.type, prompt:ex.prompt, options:ex.options, correct:ex.correctAnswer, wordIds:ex.wordIds||[]}));
  let pool = curated.slice();
  if(pool.length<20){
    const extra = pickRandom(LEVEL_DATA.words, 20-pool.length).map(w=>{
      const g = genChooseTranslation(w);
      return {kind:g.kind, prompt:g.prompt, options:g.options, correct:g.correct, wordIds:[w.id]};
    });
    pool = pool.concat(extra);
  }
  return shuffle(pool).slice(0, Math.max(20,pool.length));
}
function renderExamQuestion(){
  const q = window.__examQueue||[]; const idx = window.__examIdx||0;
  if(idx>=q.length) return renderExamResult();
  const item = q[idx];
  return `<div class="card">
    <div class="muted">Вопрос ${idx+1} / ${q.length}</div>
    <h2 style="margin-top:8px">${esc(item.prompt)}</h2>
    <div id="examBody">${(item.options||[]).map(o=>`<button class="opt" data-action="exam-choose" data-val="${esc(o)}">${esc(o)}</button>`).join("") ||
      `<input type="text" id="examInput"><button class="btn block" style="margin-top:10px" data-action="exam-fill">Ответить</button>`}</div>
  </div>`;
}
function renderExamResult(){
  const total = window.__examQueue.length;
  const correct = window.__examCorrect||0;
  const score = correct/total;
  const pass = score>=0.8;
  if(pass){
    const idx = MANIFEST.levels.findIndex(l=>l.id===STATE.currentLevel);
    const next = MANIFEST.levels[idx+1];
    if(!STATE.completedLevels.includes(STATE.currentLevel)) STATE.completedLevels.push(STATE.currentLevel);
    STATE.examHistory.push({level:STATE.currentLevel, score, date:todayISO()});
    if(next){
      STATE.currentLevel = next.id;
      LEVEL_DATA=null;
    }
    saveProgress();
    window.__examStarted=false;
    return `<div class="empty"><span class="ic">🏆</span><p>Экзамен сдан! Результат: ${Math.round(score*100)}%.</p>
      ${next ? `<p>Открыт новый уровень: <b>${esc(next.id)}</b>.</p>` : `<p class="muted">Следующий уровень пока не создан — прогресс сохранён.</p>`}
      <button class="btn" data-action="nav-hash" data-route="#/menu">В меню</button></div>`;
  } else {
    (window.__examFailedWords||[]).forEach(id=>{ const e=wp(id); e.sm2.repetitions=0; e.sm2.interval=1; e.sm2.nextReviewAt=todayISO(); });
    saveProgress();
    window.__examStarted=false;
    return `<div class="empty"><span class="ic">💪</span><p>Результат: ${Math.round(score*100)}% (нужно 80%).</p>
      <p class="muted">Слова с ошибками возвращены в очередь повторения. Экзамен можно пересдать в любое время.</p>
      <button class="btn" data-action="nav-hash" data-route="#/exam">Попробовать снова</button></div>`;
  }
}

function sendTutorChatMessage(){
  const input = document.getElementById("tutorChatInput");
  if(!input) return;
  const text = input.value.trim();
  if(!text) return;
  const chat = window.__tutorChat;
  chat.history.push({ role:"user", content:text });
  chat.loading = true;
  chat.error = null;
  document.getElementById("screen-root").innerHTML = renderTutorChat();
  fetch(TUTOR_API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Tutor-Secret": STATE.settings.tutorSecret },
    body: JSON.stringify({
      level: STATE.currentLevel || "A1",
      topic: "свободный разговор",
      message: text,
      history: chat.history.slice(0, -1).map(m=>({role:m.role, content:m.content}))
    })
  }).then(async (r)=>{
    if(!r.ok){
      const t = await r.text().catch(()=>"");
      throw new Error("HTTP "+r.status+(t ? (": "+t.slice(0,200)) : ""));
    }
    return r.json();
  }).then((data)=>{
    chat.loading = false;
    const reply = data.reply || "(пустой ответ)";
    chat.history.push({ role:"assistant", content:reply });
    document.getElementById("screen-root").innerHTML = renderTutorChat();
    Speech.speak(reply);
  }).catch((err)=>{
    chat.loading = false;
    chat.error = (err && err.message) || String(err);
    document.getElementById("screen-root").innerHTML = renderTutorChat();
  });
}
document.addEventListener("keydown", (ev)=>{

    ev.preventDefault();
    sendTutorChatMessage();
  }
});

document.addEventListener("click", async (ev)=>{
  const el = ev.target.closest("[data-action]");
  if(!el) return;
  const action = el.dataset.action;

  if(action==="nav" || action==="nav-hash"){
    go(el.dataset.route);
    return;
  }
  if(action==="imm-toggle"){
    const old = el.textContent;
    el.textContent = el.dataset.ru;
    setTimeout(()=>{ el.textContent = old; }, 1200);
    return;
  }
  if(action==="speak"){ Speech.speak(el.dataset.text); return; }

  if(action==="new-next"){
    introduceWord(el.dataset.word);
    window.__newIdx = (window.__newIdx||0)+1;
    document.getElementById("screen-root").innerHTML = renderNewCard();
    return;
  }
  if(action==="reveal"){
    window.__reviewRevealed = true;
    Speech.speak(WORDS_BY_ID[(window.__reviewQueue||[])[window.__reviewIdx]].en);
    document.getElementById("screen-root").innerHTML = renderReviewCard();
    return;
  }
  if(action==="grade"){
    gradeWord(el.dataset.word, el.dataset.grade);
    window.__reviewIdx = (window.__reviewIdx||0)+1;
    window.__reviewRevealed=false;
    document.getElementById("screen-root").innerHTML = renderReviewCard();
    return;
  }

  if(action==="ans-choose"){
    const ex = currentExercise();
    const ok = el.dataset.val===ex.correct;
    document.querySelectorAll("#exBody .opt").forEach(b=>{
      b.disabled=true;
      if(b.dataset.val===ex.correct) b.classList.add("correct");
      else if(b===el) b.classList.add("wrong");
    });
    document.getElementById("exBody").insertAdjacentHTML("beforeend", resultBannerHtml(ok, ok ? "Верно!" : "Правильный ответ: "+ex.correct));
    window.__lastWrongAnswer = el.dataset.val;
    markExerciseResult(ok, ok ? RESULT_DELAY : null);
    if(!ok) document.getElementById("exBody").insertAdjacentHTML("beforeend", mistakeActionsHtml());
    return;
  }
  if(action==="ans-fill"){
    const ex = currentExercise();
    const val = document.getElementById("fbInput").value;
    const ok = similar(val, ex.correct);
    document.getElementById("exBody").insertAdjacentHTML("beforeend", resultBannerHtml(ok, ok ? "Верно!" : "Правильный ответ: "+ex.correct));
    window.__lastWrongAnswer = val;
    markExerciseResult(ok, ok ? RESULT_DELAY : null);
    if(!ok) document.getElementById("exBody").insertAdjacentHTML("beforeend", mistakeActionsHtml());
    return;
  }
  if(action==="tok-pick"){
    const ex = currentExercise();
    const area = document.getElementById("tokenArea");
    window.__picked = window.__picked || [];
    window.__picked.push(el.dataset.i);
    el.disabled = true;
    area.innerHTML = window.__picked.map(i=>esc(ex.tokens[i])).join(" ");
    return;
  }
  if(action==="ans-build"){
    const ex = currentExercise();
    const picked = (window.__picked||[]).map(i=>ex.tokens[i]);
    const ok = picked.join(" ").toLowerCase()===ex.correctOrder.join(" ").toLowerCase();
    document.getElementById("exBody").innerHTML = resultBannerHtml(ok, ok ? "Верно!" : "Правильно: "+ex.correctOrder.join(" "));
    window.__lastWrongAnswer = picked.join(" ");
    window.__picked=[];
    markExerciseResult(ok, ok ? RESULT_DELAY : null);
    if(!ok) document.getElementById("exBody").insertAdjacentHTML("beforeend", mistakeActionsHtml());
    return;
  }
  if(action==="next-exercise"){ advanceExercise(); return; }
  if(action==="explain-mistake"){
    const ex = currentExercise(); if(!ex) return;
    if(!STATE.settings.tutorSecret){
      toast("Сначала введите пароль ИИ в Настройках («ИИ-репетитор»).");
      return;
    }
    el.disabled = true;
    el.textContent = "🤖 Объясняю…";
    fetch(TUTOR_API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Tutor-Secret": STATE.settings.tutorSecret },
      body: JSON.stringify({
        level: STATE.currentLevel || "A1",
        topic: "разбор ошибки в упражнении",
        message: describeExerciseForAI(ex, window.__lastWrongAnswer||""),
        history: []
      })
    }).then(async (r)=>{
      if(!r.ok){
        const text = await r.text().catch(()=>"");
        throw new Error("HTTP "+r.status+(text ? (": "+text.slice(0,200)) : ""));
      }
      return r.json();
    }).then((data)=>{
      el.insertAdjacentHTML("beforebegin", `<div class="card" style="margin-top:10px"><p class="muted">Объяснение учителя:</p><p>${esc(data.reply||"")}</p></div>`);
      el.remove();
    }).catch((err)=>{
      el.disabled = false;
      el.textContent = "🤖 Объяснить ошибку";
      toast("Не удалось получить объяснение: "+((err&&err.message)||String(err)));
    });
    return;
  }

  if(action==="pronounce-ex"){
    const target = el.dataset.target;
    el.textContent = "🎙 Слушаю…"; el.disabled = true;
    Speech.recognize().then(alts=>{
      const ok = alts.some(a=>similar(a, target));
      document.getElementById("pronResult").outerHTML = resultBannerHtml(ok, ok ? "Отлично! Произношение верное." : "Не совсем. Правильно: "+target, "pronResult");
      el.textContent = "🎤 Начать запись"; el.disabled = false;
      markExerciseResult(ok, RESULT_DELAY);
    }).catch(err=>{
      el.textContent = "🎤 Начать запись"; el.disabled = false;
      toast(err.message==="unsupported" ? "Распознавание речи недоступно в этом браузере" : "Не удалось распознать речь. Попробуйте снова.");
    });
    return;
  }
  if(action==="pronounce"){
    const target = el.dataset.target;
    const wordId = el.dataset.wordid;
    const original = el.textContent;
    el.textContent = "🎙 Слушаю…"; el.disabled = true;
    Speech.recognize().then(alts=>{
      const ok = alts.some(a=>similar(a, target));
      el.textContent = ok ? "✅ Отлично!" : "❌ Ещё раз?";
      el.disabled = false;
      if(wordId) pushChannel(wordId, "pronunciation", ok);
      setTimeout(()=>{ el.textContent = original; }, RESULT_DELAY);
    }).catch(err=>{
      el.textContent = original; el.disabled = false;
      toast(err.message==="unsupported" ? "Распознавание речи недоступно в этом браузере" : "Не удалось распознать речь. Попробуйте снова.");
    });
    return;
  }
  if(action==="call-next"){ callAdvance(); return; }
  if(action==="call-choose"){
    const call = callData(window.__callId);
    const line = call.lines[window.__callIdx];
    const opt = line.options[Number(el.dataset.i)];
    line._chosen = opt;
    const optButtons = [...document.querySelectorAll("#callOpts .opt")];
    optButtons.forEach(b=>b.disabled=true);
    el.classList.add(opt.correct?"correct":"wrong");
    if(!opt.correct){
      const correctIdx = line.options.findIndex(o=>o.correct);
      if(correctIdx>=0 && optButtons[correctIdx]) optButtons[correctIdx].classList.add("correct");
    }
    document.getElementById("callOpts").insertAdjacentHTML("afterend", resultBannerHtml(opt.correct, opt.correct ? "Верно!" : "Правильно: "+line.options.find(o=>o.correct).en));
    setTimeout(callAdvance, RESULT_DELAY);
    return;
  }
  if(action==="call-speak"){
    const call = callData(window.__callId);
    const line = call.lines[window.__callIdx];
    const btn = el;
    btn.textContent = "🎙 Слушаю…"; btn.disabled = true;
    Speech.recognize().then(alts=>{
      const matched = line.options.find(o=>alts.some(a=>similar(a, o.en)));
      const ok = matched ? matched.correct : false;
      line._chosen = matched || {en: alts[0]};
      document.getElementById("callMicResult").outerHTML = resultBannerHtml(ok, ok ? "Отлично, засчитано!" : "Не совсем то. Идём дальше.", "callMicResult");
      btn.textContent = "🎤 Ответить голосом"; btn.disabled = false;
      setTimeout(callAdvance, RESULT_DELAY);
    }).catch(err=>{
      btn.textContent = "🎤 Ответить голосом"; btn.disabled = false;
      toast(err.message==="unsupported" ? "Распознавание речи недоступно в этом браузере" : "Не удалось распознать речь. Попробуйте снова.");
    });
    return;
  }
  if(action==="gram-choose"){
    const ok = el.dataset.val===el.dataset.correct;
    recordGrammar(window.__gramGid, ok);
    document.querySelectorAll("#gramBody .opt, [data-action=gram-choose]").forEach(b=>{ b.disabled=true; if(b.dataset.val===el.dataset.correct) b.classList.add("correct"); });
    document.getElementById("gramBody").insertAdjacentHTML("beforeend", resultBannerHtml(ok, ok ? "Верно!" : "Правильный ответ: "+el.dataset.correct));
    setTimeout(()=>{ window.__gramIdx=(window.__gramIdx||0)+1; document.getElementById("gramBody").innerHTML = renderGrammarExercise(); }, RESULT_DELAY);
    return;
  }
  if(action==="gram-fill"){
    const val = document.getElementById("gramInput").value;
    const ok = similar(val, el.dataset.correct);
    recordGrammar(window.__gramGid, ok);
    document.getElementById("gramBody").insertAdjacentHTML("beforeend", resultBannerHtml(ok, ok ? "Верно!" : "Правильно: "+el.dataset.correct));
    setTimeout(()=>{ window.__gramIdx=(window.__gramIdx||0)+1; document.getElementById("gramBody").innerHTML = renderGrammarExercise(); }, RESULT_DELAY);
    return;
  }

  if(action==="exam-start"){
    window.__examStarted=true; window.__examQueue=buildExamPool(); window.__examIdx=0; window.__examCorrect=0; window.__examFailedWords=[];
    document.getElementById("screen-root").innerHTML = renderExamQuestion();
    return;
  }
  if(action==="exam-choose"){
    const item = window.__examQueue[window.__examIdx];
    const ok = el.dataset.val===item.correct;
    document.querySelectorAll("#examBody .opt").forEach(b=>{
      b.disabled=true;
      if(b.dataset.val===item.correct) b.classList.add("correct");
      else if(b===el) b.classList.add("wrong");
    });
    document.getElementById("examBody").insertAdjacentHTML("beforeend", resultBannerHtml(ok, ok ? "Верно!" : "Правильный ответ: "+item.correct));
    handleExamAnswer(item, ok);
    return;
  }
  if(action==="exam-fill"){
    const item = window.__examQueue[window.__examIdx];
    const val = document.getElementById("examInput").value;
    const ok = similar(val, item.correct);
    document.getElementById("examBody").insertAdjacentHTML("beforeend", resultBannerHtml(ok, ok ? "Верно!" : "Правильный ответ: "+item.correct));
    document.getElementById("examInput").disabled = true;
    handleExamAnswer(item, ok);
    return;
  }

  if(action==="tutor-test-send"){
    if(!STATE.settings.tutorSecret){
      window.__tutorTestState = "error";
      window.__tutorTestError = "Сначала введите пароль в настройках (раздел «ИИ-репетитор»).";
      document.getElementById("screen-root").innerHTML = renderTutorTest();
      return;
    }
    window.__tutorTestState = "loading";
    document.getElementById("screen-root").innerHTML = renderTutorTest();
    fetch(TUTOR_API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Tutor-Secret": STATE.settings.tutorSecret },
      body: JSON.stringify({
        level: STATE.currentLevel || "A1",
        topic: "проверка связи",
        message: "Hello! This is a connection test. Please reply with one short friendly sentence.",
        history: []
      })
    }).then(async (r)=>{
      if(!r.ok){
        const text = await r.text().catch(()=>"");
        throw new Error("HTTP "+r.status+(text ? (": "+text.slice(0,200)) : ""));
      }
      return r.json();
    }).then((data)=>{
      window.__tutorTestState = "success";
      window.__tutorTestReply = data.reply || "(пустой ответ)";
      document.getElementById("screen-root").innerHTML = renderTutorTest();
    }).catch((err)=>{
      window.__tutorTestState = "error";
      window.__tutorTestError = (err && err.message) || String(err);
      document.getElementById("screen-root").innerHTML = renderTutorTest();
    });
    return;
  }
  if(action==="tutor-chat-send"){ sendTutorChatMessage(); return; }
  if(action==="tutor-chat-reset"){
    window.__tutorChat = { history: [], loading: false, error: null };
    document.getElementById("screen-root").innerHTML = renderTutorChat();
    return;
  }
  if(action==="set-font"){
    STATE.settings.fontSize = Number(el.dataset.size);
    applyFontScale();
    saveProgress();
    document.getElementById("screen-root").innerHTML = await routes["settings"]([], {});
    return;
  }
  if(action==="export"){ exportBackup(); return; }
  if(action==="reset-progress"){
    if(confirm("Точно сбросить весь прогресс? Это действие нельзя отменить.")){
      STATE = defaultProgress();
      saveProgress();
      go("#/menu"); router();
    }
    return;
  }
});
function handleExamAnswer(item, ok){
  if(ok) window.__examCorrect=(window.__examCorrect||0)+1;
  else (item.wordIds||[]).forEach(id=>window.__examFailedWords.push(id));
  setTimeout(()=>{
    window.__examIdx++;
    document.getElementById("screen-root").innerHTML = renderExamQuestion();
  }, RESULT_DELAY);
}
function recordGrammar(gid, ok){
  if(!STATE.grammarProgress[gid]) STATE.grammarProgress[gid]={attempts:0,correct:0};
  STATE.grammarProgress[gid].attempts++;
  if(ok) STATE.grammarProgress[gid].correct++;
  saveProgress();
}

document.addEventListener("change", (ev)=>{
  if(ev.target.id==="immRange"){
    STATE.immersionLevel = Number(ev.target.value)/100;
    document.getElementById("immVal").textContent = ev.target.value+"%";
    saveProgress();
  }
  if(ev.target.id==="chkAlphabet"){ STATE.settings.showAlphabet = ev.target.checked; saveProgress(); }
  if(ev.target.id==="chkSpeech"){ STATE.settings.speechEnabled = ev.target.checked; saveProgress(); }
  if(ev.target.id==="chkRecog"){ STATE.settings.recognitionEnabled = ev.target.checked; saveProgress(); }
  if(ev.target.id==="importFile"){ importBackup(ev.target.files[0]); }
  if(ev.target.id==="tutorSecretInput"){ STATE.settings.tutorSecret = ev.target.value; saveProgress(); }
});
document.addEventListener("input", (ev)=>{
  if(ev.target.id==="immRange") document.getElementById("immVal").textContent = ev.target.value+"%";
});

const RESULT_DELAY = 2000;
function resultBannerHtml(ok, text, id){
  return `<div class="result-banner ${ok?"correct":"wrong"}"${id?` id="${id}"`:""}>${ok?"✅":"❌"} ${esc(text)}</div>`;
}
function toast(msg){
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2400);
}
function exportBackup(){
  const blob = new Blob([JSON.stringify(STATE,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "english-progress-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importBackup(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data || typeof data!=="object" || !data.words) throw new Error("bad format");
      STATE = Object.assign(defaultProgress(), data);
      saveProgress();
      LEVEL_DATA=null;
      alert("Резервная копия загружена.");
      ensureLevelLoaded().then(()=>{ go("#/menu"); router(); });
    }catch(e){ alert("Не удалось загрузить файл: "+e.message); }
  };
  reader.readAsText(file);
}

document.getElementById("backBtn").addEventListener("click", goBack);
document.querySelectorAll("#bottom-nav button").forEach(b=>{
  b.addEventListener("click", ()=>go(b.dataset.route));
});

/* ============================== INIT ============================== */
(async function init(){
  try{
    await router();
  }catch(e){
    document.getElementById("screen-root").innerHTML = "<div class='card'><p>Ошибка загрузки: "+esc(e.message)+"</p></div>";
  }
})();

})();
</script>
</body>
</html>
